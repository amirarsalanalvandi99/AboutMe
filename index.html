iiigAooooAKKKSgBaKKSgYtFFFAgozRRQAZopKWmmAtFJRV3Ef//Z) center/cover no-repeat fixed;color:var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center}
.env{--w:min(78vw,320px,calc(60svh/1.4));position:relative;width:var(--w);height:calc(var(--w)*1.4);transition:transform .9s ease,opacity .7s ease;perspective:900px;filter:drop-shadow(0 18px 30px rgba(10,5,60,.55))}
.env.gone{transform:translateY(70svh) scale(.8);opacity:0;pointer-events:none}
.back,.front,.flap{position:absolute;inset:0}
.back{background:#f3d9df;border-radius:6px}
.front{background:linear-gradient(#fbeef0,#f7dfe5);clip-path:polygon(0 0,50% 40%,100% 0,100% 100%,0 100%);border-radius:6px;z-index:2}
.flap{height:42%;bottom:auto;background:linear-gradient(#f6d3dc,#efc2cf);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:4}
.env.open .flap{transform:rotateX(180deg)}
.env.behind .flap{z-index:1}
.seal{position:absolute;left:50%;top:42%;width:26%;aspect-ratio:1;transform:translate(-50%,-62%);border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8446f,var(--wine));color:#ffe3ea;z-index:5;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 4px 10px rgba(80,0,30,.5),inset 0 0 0 3px rgba(255,255,255,.18);font:700 clamp(9px,2.6vw,12px) 'Vazirmatn',Tahoma,sans-serif;animation:beat 1.8s ease-in-out infinite;transition:opacity .4s}
.seal svg{width:38%;fill:#ffd3de}
.seal:focus-visible{outline:3px solid #fff;outline-offset:3px}
.env.open .seal{opacity:0;animation:none;pointer-events:none}
@keyframes beat{50%{transform:translate(-50%,-62%) scale(1.08)}}
.hint{position:absolute;bottom:calc(6% + env(safe-area-inset-bottom,0px));width:100%;text-align:center;color:#fff;font-size:14px;opacity:.85;transition:opacity .4s}
.hint.off{opacity:0}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
.card{pointer-events:auto;width:min(90vw,400px);max-height:90svh;overflow:auto;background:var(--paper);border-radius:18px;padding:22px 20px;text-align:center;box-shadow:0 20px 50px rgba(5,0,50,.55);outline:1px solid rgba(217,79,122,.35);outline-offset:-8px;position:absolute;opacity:0;transform:translateY(80svh) rotate(-3deg);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
.card.in{opacity:1;transform:none}
.card.out{opacity:0;transform:translateY(-30svh) scale(.92);transition:transform .5s,opacity .4s}
.card img{display:block;margin:4px auto 14px;max-width:100%;max-height:34svh;object-fit:contain}
.card img.round{width:min(52vw,190px);border-radius:50%}
.card p{font-size:clamp(16px,4.4vw,19px);line-height:2.1}
.card .em{font-size:1.5em;display:block;margin-top:6px}
.next{margin-top:18px;border:0;border-radius:999px;background:var(--rose);color:#fff;font:500 16px 'Vazirmatn',Tahoma,sans-serif;padding:12px 34px;cursor:pointer;box-shadow:0 6px 14px rgba(217,79,122,.4)}
.next:active{transform:scale(.96)}

{t:"سلام، چون تا بحال همو ندیدیم خواستم یک توضیح در مورد خودم بدم تا موقع ملاقات حضوری راحت‌تر براتون پیدا بشم 😄"},
{i:"sibil",r:1,t:"من سیبیل دارم، البته از قبلنا نداشتم و چون سر بازی گول یا پوچ باختم مجبور شدم به دوستام قول بدم تا آخر پاییز سیبیل بزارم. اما شاید اگه شما دوست نداشته باشین بزارم، از دوستام خواهش کنم مدت زمان جریمه رو به آخر این ماه کاهش بدن",e:"🙈"},
{i:"kot",t:"چون دارم از شرکت میام به دیدار شما پس با لباس رسمی شرکت میام که یک کت و شلوار سرمه‌ای تن من هستش",e:"🙈"},
{i:"kole",t:"من یک کوله پشتی سبز رنگ همراهم هست که لپتاپ و ظرف ناهارم توش هستش، احتمالا اون روز ناهار ماکارونی خوردم چون معمولا چهارشنبه‌ها شب ماکارونی شام داریم",e:"🙈"},
{i:"sia",t:"همه به من میگن سیاه هستم، من مشکلی با سیاه بودن ندارم چون اگه امثال من نباشیم سفیدپوستا به چشم نمیان؛ پس وجود امثال من هستش که باعث میشه اونا جذاب به نظر بیان. پس سیاه بودن همچین هم بد نیست که همه ازش بد میگن",e:"🙈"},
{t:"در نهایت امیدوارم همه چی خوب پیش بره و هرچی که خیر هست اتفاق بیوفته 🤍",last:1}
];
var env=document.getElementById('env'),stage=document.getElementById('stage'),cur=null,n=0;
function esc(s){return s}
function show(k){
  var d=C[k],c=document.createElement('div');
  c.className='card'+(d.i?' has-img':'');
  var h='';
  if(d.i)h+='<img class="'+(d.r?'round':'')+'" src="'+IMG[d.i]+'" alt="">';
  h+='<p>'+d.t+(d.e?'<span class="em">'+d.e+'</span>':'')+'</p>';
  if(!d.last)h+='<button class="next">پیام بعدی</button>';
  c.innerHTML=h;stage.appendChild(c);
  var b=c.querySelector('.next');
  if(b)b.onclick=function(){b.onclick=null;c.classList.remove('in');c.classList.add('out');setTimeout(function(){c.remove()},600);show(++n)};
  requestAnimationFrame(function(){requestAnimationFrame(function(){c.classList.add('in')})});
  if(b)setTimeout(function(){b.focus({preventScroll:true})},900);
}
document.getElementById('seal').onclick=function(){
  document.getElementById('hint').classList.add('off');
  env.classList.add('open');
  setTimeout(function(){env.classList.add('behind')},400);
  setTimeout(function(){show(0);env.classList.add('gone')},1000);
};
</script>
